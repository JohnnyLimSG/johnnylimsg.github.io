<g>
<rect x="30" y="34" width="200" height="190" rx="12" fill="#16211f"/>
<text x="54" y="66" class="k" fill="#5fc2ad">AEO</text>
<text x="54" y="98" class="h" fill="#faf8f4">Be the answer</text>
<text x="54" y="128" class="s" fill="#b9cbc6">Picked as the direct</text><text x="54" y="146" class="s" fill="#b9cbc6">answer to a question</text>
<text x="54" y="196" class="s" fill="#8d9b97">Snippets · People Also Ask</text>
</g>
<g>
<rect x="250" y="34" width="200" height="190" rx="12" fill="#0f6b5c"/>
<text x="274" y="66" class="k" fill="#d3ebe5">GEO</text>
<text x="274" y="98" class="h" fill="#fff">Be in the AI</text><text x="274" y="128" class="h" fill="#fff">answer</text>
<text x="274" y="156" class="s" fill="#d3ebe5">Mentioned, cited and</text><text x="274" y="174" class="s" fill="#d3ebe5">recommended by AI</text>
<text x="274" y="204" class="s" fill="#a9d6cb">ChatGPT · Perplexity</text>
</g>
<g>
<rect x="470" y="34" width="200" height="190" rx="12" fill="#5fc2ad"/>
<text x="494" y="66" class="k" fill="#16211f">AIO</text>
<text x="494" y="98" class="h" fill="#16211f">Be understood</text>
<text x="494" y="128" class="s" fill="#16211f">AI gets your brand right,</text><text x="494" y="146" class="s" fill="#16211f">or: optimising for Google</text><text x="494" y="164" class="s" fill="#16211f">AI Overviews</text>
<text x="494" y="204" class="s" fill="#16211f">AI Overviews · assistants</text>
</g>
