<title id="t">How SEO, AEO, GEO and AIO fit together</title>
<desc id="d">SEO is the foundation: crawlable, indexed, relevant and trusted pages. On top of it sit three goals. AEO: be the direct answer to a question. GEO: be included and recommended in AI-generated answers. AIO: be understood correctly by AI systems, including Google AI Overviews.</desc>
<style>text{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}.k{font-size:11px;font-weight:700;letter-spacing:1.3px}.h{font-family:Georgia,"Times New Roman",serif;font-size:26px;font-weight:700}.s{font-size:13px}.f{font-size:14px;font-weight:600}</style>
