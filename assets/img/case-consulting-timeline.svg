<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 700 250" width="700" height="250" role="img" aria-labelledby="t d">
<title id="t">Timeline of results for a B2B consulting firm</title>
<desc id="d">Month 0: about 1 to 2 website visits a month, not found on Google. Technical SEO, search research and consultant interviews begin, with two articles a month and a report every quarter. Part-way through the year: about 100 visits a month, as the content builds up. Later, interest in the firm's core topic dips, and the HubSpot newsletter, webinars and reports keep visits up. Month 12: about 1,000 visits a month, with enquiries, webinar sign-ups and new clients.</desc>
<style>text{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}.w{font-size:11px;font-weight:700;letter-spacing:1px}.h{font-size:15px;font-weight:700}.s{font-size:12.5px}</style>
<rect y="50" width="700" height="250" rx="16" fill="#faf8f4"/>
<path d="M70 120H630" stroke="#0f6b5c" stroke-width="4" stroke-linecap="round"/>
<g fill="#fff" stroke="#0f6b5c" stroke-width="3"><circle cx="70" cy="120" r="9"/><circle cx="210" cy="120" r="9"/><circle cx="350" cy="120" r="9"/><circle cx="490" cy="120" r="9"/></g>
<circle cx="630" cy="120" r="12" fill="#d9a441" stroke="#fff" stroke-width="3"/>
<g class="w" fill="#636e6b" text-anchor="middle"><text x="70" y="92">MONTH 0</text><text x="210" y="92">FIRST MONTHS</text><text x="350" y="92">PART-WAY</text><text x="490" y="92">LATER</text><text x="630" y="92">MONTH 12</text></g>
<g text-anchor="middle">
<text x="70" y="160" class="h" fill="#16211f">1–2 visits</text><text x="70" y="180" class="s" fill="#4a5653">a month, not</text><text x="70" y="197" class="s" fill="#4a5653">found on Google</text>
<text x="210" y="160" class="h" fill="#16211f">Foundations</text><text x="210" y="180" class="s" fill="#4a5653">technical SEO,</text><text x="210" y="197" class="s" fill="#4a5653">2 articles a month</text>
<text x="350" y="160" class="h" fill="#16211f">~100 visits</text><text x="350" y="180" class="s" fill="#4a5653">a month, as the</text><text x="350" y="197" class="s" fill="#4a5653">content builds up</text>
<text x="490" y="160" class="h" fill="#16211f">Topic dips</text><text x="490" y="180" class="s" fill="#4a5653">newsletter and</text><text x="490" y="197" class="s" fill="#4a5653">webinars hold up</text>
<text x="630" y="160" class="h" fill="#0f6b5c">~1,000 visits</text><text x="630" y="180" class="s" fill="#4a5653">a month, with</text><text x="630" y="197" class="s" fill="#4a5653">enquiries, clients</text>
</g>
<rect x="40" y="230" width="620" height="44" rx="10" fill="#e3f0ec"/>
<text x="350" y="257" text-anchor="middle" class="s" fill="#16211f">Cadence: 2 articles a month · a report every quarter · a webinar every 6 months</text>
