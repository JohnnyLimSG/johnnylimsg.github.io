<text x="30" y="58" class="k" fill="#6d7875">ONLY YOU</text><text x="30" y="74" class="k" fill="#6d7875">HAVE IT</text>
<text x="30" y="300" class="k" fill="#6d7875">EVERYONE</text><text x="30" y="316" class="k" fill="#6d7875">HAS IT</text>
